[project]
name = "neural-flow-dynamics-backend"
version = "0.1.0"
description = "Backend services for the Neural Flow Dynamics research platform"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "cfgrib>=0.9.14,<1",
    "eccodes>=2.49,<3",
    "fastapi>=0.115,<1",
    "gcsfs>=2025,<2027",
    "herbie-data>=2025,<2027",
    "numpy>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "redis>=5,<7",
    "sqlalchemy>=2,<3",
    "xarray>=2025,<2027",
    "zarr>=3,<4",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pre-commit>=4.1,<5",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["slow: opt-in tests that contact public data providers"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]